:root{
  /* A fixed 216px-tall landscape "screen" scaled to the window. "Hardwood night": deep teal field, warm cream 1px pixel frames, basketball-orange highlights, dark drop shadows; team colors only on the court and team badges. */
  --bg:#12343b; --bg2:#0e2a31; --ink:#fdf3e1; --hi:#ff8c42; --sh:#04141a; --off:#1c2a2e; --offink:#5d7377; --good:#7ee081; --bad:#ff5a6e; --k:#081a1f; --dim:#9cc3c1; --sel:#1f5964;
  --h:'Silk','Courier New',monospace; --b:'Tiny','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#061418;overscroll-behavior:none;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:none;font-smooth:never}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);color:var(--ink);font-family:var(--b);font-size:8px;line-height:10px;overflow:hidden;image-rendering:pixelated}
#stage img,#stage canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0;margin:0}
button:focus-visible,input:focus-visible{outline:1px dashed var(--hi);outline-offset:3px}
h1,h2,h3,p{margin:0;font-weight:400}
.ico{display:inline-block;vertical-align:middle;height:auto}
.stars{display:inline-flex;gap:0;vertical-align:middle;line-height:0}
.H{font-family:var(--h);font-weight:700;font-size:8px;line-height:10px;letter-spacing:0;text-transform:uppercase}
.H2{font-family:var(--h);font-weight:700;font-size:16px;line-height:18px;text-transform:uppercase}
.dim{color:var(--dim)} .hi{color:var(--hi)} .good{color:var(--good)} .bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* screens */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 10px;gap:8px}
.scr>*{flex-shrink:0}
.grow{flex:1 1 auto;min-height:0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.sp{flex:1}
.top{display:flex;align-items:center;gap:8px;height:18px}
.top .H2{flex:1;font-size:8px;line-height:10px}
.chip{font-family:var(--h);font-weight:700;font-size:8px;line-height:10px;padding:2px 4px;background:var(--k);white-space:nowrap}

/* pixel frame: 1px white border with notched corners, label sitting in the top edge */
.bx{position:relative;box-shadow:0 -1px 0 0 var(--ink),0 1px 0 0 var(--ink),-1px 0 0 0 var(--ink),1px 0 0 0 var(--ink);padding:9px 7px 6px;min-width:0}
.bx>.lbl{position:absolute;top:-5px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 3px;font:700 8px/10px var(--h);white-space:nowrap;text-transform:uppercase}
.bx.l>.lbl{left:8px;transform:none}

/* buttons */
.b{font:700 8px/10px var(--h);text-transform:uppercase;color:var(--ink);background:var(--bg);padding:5px 8px;text-align:center;white-space:nowrap;
  box-shadow:0 -1px 0 0 var(--ink),0 1px 0 0 var(--ink),-1px 0 0 0 var(--ink),1px 0 0 0 var(--ink),-2px 2px 0 1px var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.b:active:not(:disabled){transform:translate(-1px,1px);box-shadow:0 -1px 0 0 var(--ink),0 1px 0 0 var(--ink),-1px 0 0 0 var(--ink),1px 0 0 0 var(--ink),-1px 1px 0 1px var(--sh)}
.b:disabled{background:var(--off);color:var(--offink);box-shadow:0 -1px 0 0 #1c1b22,0 1px 0 0 #1c1b22,-1px 0 0 0 #1c1b22,1px 0 0 0 #1c1b22,-2px 2px 0 1px #17161c;cursor:not-allowed}
.b.hi{color:var(--hi)}
.b.tall{padding:7px 8px}
.b.big{font-size:16px;line-height:18px;padding:7px 14px}
.b.sq{width:24px;height:24px;padding:0}
.b.dark{background:var(--off);box-shadow:0 -1px 0 0 #1c1b22,0 1px 0 0 #1c1b22,-1px 0 0 0 #1c1b22,1px 0 0 0 #1c1b22,-2px 2px 0 1px #17161c}
.b.warn{background:#a3162f}
.b small{display:block;font:400 8px/10px var(--b);text-transform:none;color:var(--dim)}
.b.stack{flex-direction:column;gap:0}
.badge-dot{display:inline-block;width:5px;height:5px;background:var(--hi);box-shadow:0 0 0 1px var(--k)}
.in{font:700 8px/10px var(--h);text-transform:uppercase;background:var(--ink);color:var(--k);border:0;padding:3px 4px;text-align:center;width:100%;border-radius:0;-webkit-user-select:text;user-select:text}
.check{width:12px;height:12px;box-shadow:0 -1px 0 0 var(--ink),0 1px 0 0 var(--ink),-1px 0 0 0 var(--ink),1px 0 0 0 var(--ink);display:inline-grid;place-items:center}

/* bars and badges */
.bar{display:block;height:5px;background:var(--k);width:100%}
.bar>i{display:block;height:100%;background:var(--good)}
.bar.low>i{background:var(--bad)} .bar.xp>i{background:var(--hi)}
.bigbar{height:10px;background:var(--k);flex:1;position:relative}
.bigbar>i{display:block;height:100%;background:var(--hi)}
.tb{display:inline-grid;place-items:center;font:700 8px/10px var(--h);width:30px;height:16px;box-shadow:0 -1px 0 0 var(--k),0 1px 0 0 var(--k),-1px 0 0 0 var(--k),1px 0 0 0 var(--k)}
.tb.big{width:48px;height:28px;font-size:16px;line-height:18px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;height:5px;flex:1}
.segs i{background:var(--k)} .segs i.on{background:var(--hi)} .segs i.cap{background:var(--k);box-shadow:inset 0 0 0 1px #4f8a8f}
.plus{font:700 8px/8px var(--h);width:11px;height:9px;background:var(--good);color:var(--k);display:inline-grid;place-items:center}

/* lists */
.list{overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:1px 4px 1px 1px;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
.list::-webkit-scrollbar{width:3px} .list::-webkit-scrollbar-thumb{background:var(--ink)}
.lr{display:grid;grid-template-columns:18px 1fr auto;gap:5px;align-items:center;text-align:left;padding:3px 4px;background:var(--bg2);width:100%}
.lr.sel{background:var(--sel);box-shadow:0 0 0 1px var(--hi)}
.lr.swap{box-shadow:0 0 0 1px var(--good)}
.lr .pos{font:700 8px/10px var(--h);color:var(--dim)}
.lr .pos.st{color:var(--hi)}
.lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .rt{display:flex;align-items:center;gap:4px}
.lr .mini{width:20px}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th{font:700 8px/10px var(--h);text-align:left;color:var(--dim);padding:0 3px 2px}
table.t td{padding:1px 3px;white-space:nowrap}
table.t td.r,table.t th.r{text-align:right}
table.t tr.me td{color:var(--hi)}
table.t tr.cut td{border-bottom:1px dashed var(--dim)}

/* title */
.title{align-items:center;justify-content:center;gap:10px;padding:0}
.title canvas{position:absolute;inset:0}
.title .veil{position:absolute;inset:0;background:rgba(8,40,46,.66)}
.title .in-front{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo{font:700 32px/30px var(--h);text-transform:uppercase;text-align:center;text-shadow:-3px 3px 0 var(--sh)}
.logo span{display:block;color:var(--hi)}
.tag{color:var(--dim)}
.corner{position:absolute;top:8px;right:10px}
.cornerL{position:absolute;top:8px;left:10px}

/* save slots */
.slot{display:grid;grid-template-columns:22px 1fr 78px;gap:12px;align-items:center}
.slot .bx{height:28px;padding:8px 8px 3px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.slot .b{height:24px}
.slot .xbtn{width:22px;height:22px;background:var(--off);display:grid;place-items:center;box-shadow:0 -1px 0 0 #1c1b22,0 1px 0 0 #1c1b22,-1px 0 0 0 #1c1b22,1px 0 0 0 #1c1b22}
.slot .xbtn.arm{background:#a3162f;font:700 8px/10px var(--h);width:22px}

/* story */
.story{justify-content:center}
.story .bx{padding:14px 14px 12px;display:flex;gap:12px;align-items:flex-start}
.story p{white-space:pre-line;text-align:center;flex:1;line-height:11px}
.story p.big{font-size:16px;line-height:17px;max-height:150px;overflow-y:auto}
.story .face{width:48px;flex:none;margin-top:2px}
.story .bx.wf p{text-align:left}
.bottomR{display:flex;justify-content:flex-end;gap:10px}

/* hub */
.band{margin:-8px -10px 0;padding:5px 10px 4px;height:52px;position:relative}
.tl{display:grid;grid-template-columns:1fr 1fr 1fr;height:100%}
.tl>div{display:grid;grid-template-rows:10px 10px 13px 10px;justify-items:center;align-items:center;text-align:center}
.tl>div:first-child{justify-items:start;text-align:left}
.tl>div:last-child{justify-items:end;text-align:right}
.tl .line{position:absolute;left:0;right:0;top:30px;height:2px;background:rgba(0,0,0,.3)}
.nodewrap{display:grid;place-items:center;height:13px}
.tl .line i{position:absolute;left:0;top:0;height:2px;width:50%}

.attr{display:grid;grid-template-columns:22px 1fr 12px;gap:5px;align-items:center;height:8px}
.attr b{font:700 8px/10px var(--h);text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 6px;align-items:center}
.kv .k{font:700 8px/10px var(--h);color:var(--dim)}

/* tabs */
.tabs{display:flex;gap:8px}
.tabs .b{flex:1;padding:4px 2px}
.tabs .b.on{background:var(--ink);color:var(--bg)}

/* match */
.match{position:absolute;inset:0;background:var(--k)}
.match canvas{position:absolute;left:0;top:0;touch-action:none}
.mbtn{position:absolute;font:700 8px/10px var(--h);color:var(--ink);background:rgba(18,52,59,.94);padding:0 8px;height:22px;

.mbtn.sq{top:6px;left:8px;width:20px;height:18px;padding:0;display:grid;place-items:center}
.mctl{position:absolute;right:8px;bottom:6px;display:flex;gap:9px}
.mctl .mbtn{position:static;height:26px;min-width:46px}
.mctl .mbtn.big{min-width:68px;font-size:8px;background:var(--hi);color:var(--k)}
.mctl .mbtn.big.ff{background:rgba(18,52,59,.94);color:var(--ink)}
.mctl .mbtn.on{transform:translate(-1px,1px)}
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.banner{background:var(--bg);padding:12px 18px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;text-align:center}
.banner b{font:700 16px/18px var(--h);color:var(--hi)}
.banner.final{gap:7px}
.pov{position:absolute;inset:0;background:rgba(6,22,27,.86);display:flex;align-items:center;justify-content:center;padding:14px}
.pov[hidden]{display:none}
.pbox{background:var(--bg);display:flex;flex-direction:column;gap:7px;width:340px;max-width:100%;max-height:204px;padding:12px 10px 8px}
.pbox .how{overflow-y:auto;min-height:0;flex:1 1 auto}
.pbox .row{flex-wrap:wrap;justify-content:center}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.how b{font:700 8px/10px var(--h);color:var(--hi);margin-right:3px}

.modal{position:absolute;inset:0;background:rgba(6,22,27,.8);display:flex;align-items:center;justify-content:center;padding:10px;z-index:4}
.modal>.bx{background:var(--bg);padding:12px 10px 10px;display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--k);padding:4px 8px;max-width:90%;text-align:center;z-index:9;box-shadow:0 0 0 1px var(--ink)}

.in::placeholder{color:#9a96a8}

function scoutHTML(id) {
  const t = G.teams[id], sc = t.scheme || 'man', S = SCHEMES[sc], st = G.roster.slice(0, 5), ln = p => esc(lastName(p.name));
  const by = f => st.slice().sort((a, b) => f(b) - f(a)), list = a => (a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0]);
  let use;
  if (sc === 'paint') use = `They sag into the lane. Shoot over it with ${by(p => eff(p, 'sht') + (p.zones ? p.zones.three * .7 : 0)).slice(0, 2).map(ln).join(' and ')}.`;
  else if (sc === 'zone') use = `They guard areas. Corners open up for ${by(p => eff(p, 'sht') + (p.zones ? p.zones.three * .7 : 0)).slice(0, 2).map(ln).join(' and ')}.`;
  else if (sc === 'perim') use = `They hug shooters. Attack the rim with ${by(p => eff(p, 'reb') * .5 + eff(p, 'spd') * .3 + ((p.ht || 78) - 78) * .25).slice(0, 2).map(ln).join(' and ')}.`;
  else if (sc === 'star') { const star = by(p => p.sht * 1.2 + p.spd * .4 + (p.sup ? 3 : p.star ? 1.5 : 0) + (p.form || 0) * 2)[0], weak = st.filter(p => p !== star).sort((a, b) => a.sht - b.sht)[0]; use = `They will trap ${ln(star)}. Swing it to ${ln(weak)}.`; }
  else use = 'No tricks. Win your matchups.';
  const five = aiFive(t), ss = five.filter(p => p.star).sort((a, b) => (b.sup ? 1 : 0) - (a.sup ? 1 : 0));
  const both = st.concat(five), hot = both.filter(p => formTag(p) === 'hot'), cold = both.filter(p => formTag(p) === 'cold');
  const out = (t.roster || []).filter(p => p.inj > 0 && (p.star || t.roster.indexOf(p) < 5)).map(ln);
  const right = [ss.length ? `<span class="hi">${ico(ss[0].sup ? 'crown' : 'star', ss[0].sup ? 9 : 7)} Watch: ${list(ss.map(p => (p.sup ? 'superstar ' : '') + ln(p)))}.</span>` : '',
    out.length ? `<span class="good">Out for them: ${list(out)}.</span>` : '',
    hot.length || cold.length ? `<span>${hot.length ? `${ico('fire', 6)} <span class="ftag hot">HOT</span> ${hot.slice(0, 2).map(ln).join(', ')}` : ''}${hot.length && cold.length ? ' ' : ''}${cold.length ? `${ico('snow', 6)} <span class="ftag cold">SLUMP</span> ${cold.slice(0, 2).map(ln).join(', ')}` : ''}</span>` : ''].filter(Boolean);
  return `<div class="scoutg"><div class="scout"><span class="H hi">THEIR D: ${S.n}</span><span>${use}</span></div>${right.length ? `<div class="scout">${right.join('')}</div>` : ''}</div>`;
}

function miniCard(p, tid) {

    <span class="row" style="gap:4px"><span class="H dim">NOW</span>${starsHTML(ovr(p), 7)}<span class="H dim">MAX</span>${starsHTML(ovr(p, true), 7)}</span></div></div>

    ${zonesHTML(p, false)}
    <span class="dim">$${p.sal}M x ${p.yrs} &middot; ${p.st.gp ? `${(p.st.pts / g).toFixed(1)} pts, ${(p.st.reb / g).toFixed(1)} reb, FG ${fgPct(p.st)}${p.st.td ? ', ' + p.st.td + ' TD' : ''}` : 'no games this season'}</span></div>`;
}
function tradeBody() {
  if (G.phase === 'playoffs') return '<p class="hi">Trades are frozen during the playoffs. The market opens again in the offseason.</p>';
  const list = tradeTeams(); if (!list.includes(U.tt)) U.tt = list[0];
  const tid = U.tt, t = G.teams[tid], T = TEAMS[tid];
  U.tget = (U.tget || []).filter(id => t.roster.some(p => p.id === id)); U.tgive = (U.tgive || []).filter(id => byId(id)); U.tcred = clamp(U.tcred || 0, 0, G.cc);
  if (U.tview === 'deal') {

    const row = (p, on, act) => `<button class="lr ${on ? 'sel' : ''}" data-act="${act}" data-id="${p.id}" style="grid-template-columns:12px 18px 1fr auto"><span>${on ? ico('check', 6) : ''}</span><span class="pos">${POS[p.pos]}</span><span class="nm">${starTag(p)}${esc(p.name)} <span class="dim">${fmtHt(p.ht)} ${p.age}</span></span><span class="rt">${starsHTML(ovr(p), 7)}</span></button>`;

      <div class="bx" style="flex:1;padding:9px 4px 3px;display:flex;flex-direction:column"><span class="lbl">YOU GET (${esc(T.abbr)})</span><div class="list grow">${t.roster.map(p => row(p, U.tget.includes(p.id), 'tGet')).join('')}</div></div>
      <div class="bx" style="flex:1;padding:9px 4px 3px;display:flex;flex-direction:column"><span class="lbl">YOU GIVE</span><div class="list grow">${G.roster.map(p => row(p, U.tgive.includes(p.id), 'tGive')).join('')}</div></div></div>
      <div class="row" style="gap:8px"><button class="b sq" data-act="tBrowse" aria-label="Back to team">${ico('left', 7)}</button>
        <span class="H">CREDITS</span><button class="b mini" data-act="tCred" data-id="-1" ${U.tcred <= 0 ? 'disabled' : ''}>-</button><span class="H hi" style="width:14px;text-align:center">${U.tcred}</span><button class="b mini" data-act="tCred" data-id="1" ${U.tcred >= G.cc ? 'disabled' : ''}>+</button>
        <span class="bigbar" style="flex:1;max-width:90px" title="Deal meter"><i style="width:${Math.round(clamp(ev.ratio, 0, 1) * 100)}%;background:${col}"></i></span>

        <button class="b hi" data-act="tPropose" ${ev.block ? 'disabled' : ''}>PROPOSE</button></div>`;
  }

  const p = t.roster.find(q => q.id === U.tsel), inDeal = U.tget.includes(p.id);

  return `<div class="row" style="gap:8px"><button class="b sq" data-act="tTeam" data-id="-1" aria-label="Previous team">${ico('left', 7)}</button>
      ${tbadge(tid)}<span class="H sp">${esc(tFull(T))} <span class="dim">${rec(t)}</span></span><span class="H dim">OFF</span>${starsHTML(t.off, 7)}<span class="H dim">DEF</span>${starsHTML(t.def, 7)}
      <button class="b" data-act="tPick">ALL TEAMS</button><button class="b sq" data-act="tTeam" data-id="1" aria-label="Next team">${ico('right', 7)}</button></div>
    <div class="row grow" style="align-items:stretch;gap:12px">
      <div class="list" style="flex:1.05">${t.roster.map((q, i) => `<button class="lr ${U.tsel === q.id ? 'sel' : ''}" data-act="tSel" data-id="${q.id}"><span class="pos ${i < 5 ? 'st' : ''}">${i < 5 ? POS[i] : 'BN'}</span><span class="nm">${U.tget.includes(q.id) ? ico('check', 6) + ' ' : ''}${starTag(q)}${esc(q.name)}${formIco(q)}${q.inj > 0 ? ' <span class="bad">OUT</span>' : ''} <span class="dim">${POS[q.pos]} ${fmtHt(q.ht)}</span></span><span class="rt">${starsHTML(ovr(q), 7)}</span></button>`).join('')}</div>
      <div class="col" style="flex:1;gap:7px"><div class="bx" style="padding:7px 6px 4px">${miniCard(p, tid)}</div>
        <div class="row" style="gap:9px"><button class="b sp ${inDeal ? 'dark' : ''}" data-act="tGet" data-id="${p.id}">${inDeal ? 'REMOVE' : 'ADD TO DEAL'}</button>
        <button class="b sp hi" data-act="tDeal" ${U.tget.length ? '' : 'disabled'}>OFFER (${U.tget.length}) ${ico('right', 5)}</button></div>
        </div></div>`;
}

        return `<div class="lr" style="grid-template-columns:18px 1fr auto auto;padding:4px 5px"><span class="pos">${POS[p.pos]}</span><span class="nm">${esc(p.name)} <span class="dim">age ${p.age}</span> ${starsHTML(ovr(p), 7)}</span>
          <span>${e.done === 'kept' ? `<span class="good">Signed</span> $${p.sal}M x ${p.yrs}` : `Wants <span class="hi">$${e.ask}M</span> x ${e.yrs} yrs (now $${p.sal}M)`}</span>
          <span class="row" style="gap:8px">${e.done === 'kept' ? '' : `<button class="b" data-act="resign" data-id="${p.id}">RE-SIGN</button><button class="b dark" data-act="letgo" data-id="${p.id}">LET GO</button>`}</span></div>`; }).join('') : '<p class="dim">No contracts are expiring this year.</p>'}</div>
      <div class="row"><button class="b" data-act="goRoster">ROSTER</button><span class="sp"></span><button class="b tall hi" data-act="offNext">ON TO THE DRAFT</button></div></div>`;
  }
  if (!o.prospects.find(p => p.id === U.dsel)) U.dsel = o.prospects[0] ? o.prospects[0].id : null;
  const p = o.prospects.find(q => q.id === U.dsel), sal = draftCost(), no = o.at + 1;
  const why = G.roster.length >= MAXR ? `Roster is full (${MAXR}). Release someone first.` : payroll() + sal > CAP ? 'Not enough cap space.' : '';
  return `<div class="scr" style="gap:8px"><div class="top">${back('hub')}<h2 class="H2">DRAFT &middot; ROUND ${draftRound()}, PICK ${no}</h2>${chips()}</div>
    <div class="row grow" style="align-items:stretch;gap:12px">
      <div class="list" style="flex:1.05">${o.prospects.slice(0, 14).map(q => `<button class="lr ${U.dsel === q.id ? 'sel' : ''}" data-act="dsel" data-id="${q.id}"><span class="pos">${POS[q.pos]}</span><span class="nm">${esc(q.name)} <span class="dim">${fmtHt(q.ht)} &middot; ${q.age}</span></span><span class="rt"><span class="H dim">MAX</span>${starsHTML(ovr(q, true), 7)}</span></button>`).join('')}</div>
      <div class="col" style="flex:1;gap:7px">${p ? `<div class="bx" style="padding:7px 6px 4px">${miniCard(p, G.teamId)}</div>
        <button class="b" data-act="draft" data-id="${p.id}" ${why ? 'disabled' : ''}>DRAFT: 3 YEARS, $${sal}M</button>${why ? `<span class="hi">${why}</span>` : ''}` : ''}
        <div class="row" style="gap:9px"><button class="b sp" data-act="goRoster">ROSTER</button><button class="b sp ${U.arm === 'pass' ? 'warn' : ''}" data-act="offNext">${U.arm === 'pass' ? 'SURE?' : 'PASS'}</button></div></div></div></div>`;
};

/* ================= the feed ================= */
const AVC = {};
function avHTML(x) {
  if (x.logo !== null && x.logo !== undefined && TEAMS[x.logo]) { const T = TEAMS[x.logo]; return `<span class="av tbav" style="background:${T.c1};color:${lum(T.c1) > 150 ? '#140f26' : '#fff'};box-shadow:inset 0 -3px 0 ${T.c2}">${esc(T.abbr)}</span>`; }
  const f = x.f || ACCTS.mo.f, bg = FEED_BG[x.role] || '#1f5964', k = JSON.stringify(f) + bg;
  if (!AVC[k]) AVC[k] = faceURL(f, bg);
  return `<img class="av" src="${AVC[k]}" alt="">`;
}
function feedUnread() { return G && G.feed ? G.feed.filter(x => x.id > (G.feedSeen || 0)).length : 0; }
function feedRows() {
  const f = U.feedTab || 'all';
  return (G.feed || []).filter(x => f === 'all' || (f === 'mine' ? x.mine : x.star));
}
function postHTML(x, mark) {
  return `<div class="fp ${x.id > mark ? 'new' : ''}">${avHTML(x)}<div class="fb">
    <div class="fh"><span class="H fn">${esc(x.n)}</span>${x.v ? ico('ver', 7, 'vr') : ''}<span class="dim fhd">@${esc(x.h)} &middot; ${esc(x.w)}</span></div>
    ${x.re ? `<div class="dim">replying to <span class="lnk">@${esc(x.re)}</span></div>` : ''}
    <div class="ft">${esc(x.t).replace(/(#[A-Za-z]+|@[a-z0-9_]+)/g, '<span class="lnk">$1</span>')}</div>
    <div class="fm dim"><span>${ico('heart', 7)} ${fmtK(x.likes)}</span><span>${ico('rt', 7)} ${fmtK(x.rts)}</span></div></div></div>`;
}
function feedSnips() {
  const mark = G.last && G.last.feed0 !== undefined ? G.last.feed0 : 1e9, a = (G.feed || []).filter(x => x.id > mark && x.mine).slice(0, 2);
  if (!a.length) return '';
  return `<p class="H dim">ON ${FEED_APP}</p>` + a.map(x => `<p class="snip"><span class="lnk">@${esc(x.h)}</span> ${esc(x.t.split('\n')[0])}</p>`).join('');
}
SCREENS.feed = a => {
  const rows = feedRows(), mark = U.feedMark || 0, f = U.feedTab || 'all';
  const tabs = `<div class="tabs" style="width:186px">${[['all', 'ALL'], ['mine', 'MY TEAM'], ['stars', 'STARS']].map(([k, l]) => `<button class="b ${f === k ? 'on' : ''}" data-act="feedTab" data-id="${k}">${l}</button>`).join('')}</div>`;
  return `<div class="scr" style="gap:7px"><div class="top">${back(a && a.from ? a.from : 'hub')}<h2 class="H2">${ico('bubble', 9)} ${FEED_APP}</h2>${tabs}</div>
    <div class="bx grow" style="padding:6px 3px 3px;display:flex;flex-direction:column;min-height:0"><div class="list grow feed">${rows.length ? rows.map(x => postHTML(x, mark)).join('') : `<p class="dim" style="padding:6px">${f === 'mine' ? 'Nobody is talking about your team yet. Win something.' : f === 'stars' ? 'No posts about stars yet.' : 'Quiet day on ' + FEED_APP + '.'}</p>`}</div></div></div>`;
};

/* ================= actions ================= */
Object.assign(ACT, {
  go: id => { NOTE = ''; if (id === 'roster') U.from = 'hub'; go(id); },
  full: () => toggleFullscreen(),
  myScheme: () => { const k = SCHEME_KEYS, i = k.indexOf(G.scheme || 'man'); G.scheme = k[(i + 1) % k.length]; saveGame(); toast(`Your defense: ${SCHEMES[G.scheme].n}. ${{ man: 'Everyone guards his man.', paint: 'You sag into the lane and dare them to shoot.', perim: 'You hug their shooters and give up drives.', star: 'You trap their best scorer.', zone: 'You guard areas and protect the paint.' }[G.scheme]}`); rr(); },
  tutStart: from => { G.tutAsked = true; saveGame(); startTutorial(from || SCR); },
  tutSkip: () => { G.tutAsked = true; saveGame(); rr(); },
  openFeed: from => { U.feedMark = G.feedSeen || 0; G.feedSeen = G.feedId || 0; saveGame(); go('feed', { from: from || 'hub' }); },
  feedTab: k => { U.feedTab = k; rr(); },
  del: id => { if (U.arm !== 'del' + id) { U.arm = 'del' + id; rr(); return; } deleteSlot(+id); U.arm = ''; rr(); },
  load: id => { G = readSlot(+id); if (!G) { rr(); return; } useLeague(G.league, G.tnames); ensureRosters(); nextScreen('hub'); },
  newgame: id => { useLeague('nba'); U.slot = +id; U.draft = randomCoach(); U.draft.fav = ri(0, TEAMS.length - 1); go('welcome'); },
  faceEdit: () => { U.modal = 'face'; rr(); },
  faceStep: v => { const [k, d] = v.split(':'), n = { skin: 5, hair: 6, hcol: 5, beard: 4, glasses: 2, shirt: 4 }[k]; U.draft.face[k] = (U.draft.face[k] + +d + n) % n; rr(); },
  faceRandom: () => { U.draft.face = randomFace(); rr(); },
  modalClose: () => { U.modal = ''; rr(); },
  favOpen: () => { U.modal = 'fav'; rr(); },
  favSet: id => { U.draft.fav = +id; U.modal = ''; rr(); },
  startFav: () => { U.draft.startFav = !U.draft.startFav; rr(); },
  randomCoach: () => { const s = U.draft.startFav; U.draft = randomCoach(); U.draft.startFav = s; rr(); },
  startCareer: () => {
    const d = U.draft; d.first = (d.first || '').trim(); d.last = (d.last || '').trim();
    if (!d.first || !d.last) { toast('Type a first and last name, or press RANDOM COACH.'); return; }
    newCareer(U.slot, d); U.draft = null; nextScreen('hub');
  },
  storyNext: () => { G.story.shift(); saveGame(); if (G.story.length) rr(); else go((ARG && ARG.then) || 'hub'); },
  dil: w => { answerDilemma(w); rr(); },
  dilDone: () => { G.dil = null; saveGame(); nextScreen('hub'); },
  hubGo: () => {
    if (G.phase === 'offseason') { go('off'); return; }
    if (nextGame()) { go('pregame'); return; }
    if (G.phase === 'playoffs' && G.po.champ < 0) { simRestOfPlayoffs(); nextScreen('hub'); return; }
    if (G.phase === 'playoffs') { beginOffseason(); nextScreen('off'); }
  },
  play: () => { const g = nextGame(); if (g) startMatch(g); },
  quicksim: () => { const g = nextGame(); if (!g) return; fixLineup(); const r = quickSimUser(g.opp); finishUserGame(r.ms, r.os, r.box, true, null, r.extra); go('post'); },
  postNext: () => { if (!G.last.isPO && G.phase === 'regular' && R() < .3) { rollDilemma(); go('dilemma'); } else nextScreen('hub'); },
  psel: id => { U.sel = +id; U.arm = ''; rr(); },
  sp: a => { const p = byId(U.sel); if (p && spendSP(p, a)) { saveGame(); sfx('good'); } rr(); },
  spZone: k => { const p = byId(U.sel); if (p && spendZone(p, k)) { saveGame(); sfx('good'); } rr(); },
  swapStart: id => { U.swap = +id; rr(); },
  swapCancel: () => { U.swap = null; rr(); },
  swapWith: id => { if (+id !== U.swap) swapPlayers(U.swap, id); U.swap = null; rr(); },
  auto: () => { autoLineup(); saveGame(); rr(); },
  release: id => { if (U.arm !== 'release') { U.arm = 'release'; rr(); return; } releasePlayer(id); U.arm = ''; U.sel = null; rr(); },
  tab: k => { U.tab = k; NOTE = ''; U.bracket = false; rr(); },
  bracket: () => { U.bracket = !U.bracket; rr(); },
  fsel: id => { U.fsel = +id; rr(); },
  sign: id => { if (signFA(id)) { sfx('good'); NOTE = 'Signed! He joins the bench.'; } rr(); },
  fac: k => { if (upgradeFac(k)) { sfx('good'); NOTE = 'Upgrade complete.'; } rr(); },
  meeting: () => { if (teamMeeting()) NOTE = 'Dinner was a hit. Morale is up.'; rr(); },
  rest: () => { if (restDay()) NOTE = 'Everyone feels fresher.'; rr(); },
  takeJob: id => { switchTeam(id); NOTE = ''; nextScreen('off'); },
  jobsOpen: () => { const why = jobBlock(); if (why) { toast(why); return; } U.modal = 'jobs'; rr(); },
  jobPick: id => { U.job = +id; U.modal = 'jobOk'; rr(); },
  jobApply: () => { const r = applyJob(U.job); U.modal = ''; if (r.ok) { NOTE = ''; nextScreen(G.phase === 'offseason' ? 'off' : 'hub'); } else { toast(r.msg); rr(); } },
  goRoster: () => { U.from = 'off'; SCR = 'roster'; ARG = null; U.arm = ''; render(false); },
  resign: id => { NOTE = resign(id) ? '' : 'Not enough cap space for that deal.'; rr(); },
  letgo: id => { letGo(id); rr(); },
  dsel: id => { U.dsel = +id; U.arm = ''; rr(); },
  draft: id => { if (draftPlayer(id)) { sfx('good'); if (G.phase === 'regular') nextScreen('hub'); else go('off'); } else rr(); },
  offNext: () => {
    if (G.off.step === 'draft' && U.arm !== 'pass') { U.arm = 'pass'; rr(); return; }
    NOTE = ''; offNext(); if (G.phase === 'regular') nextScreen('hub'); else go('off');
  },
  setDiff: () => { G.settings.diff = (G.settings.diff + 1) % 3; saveGame(); rr(); },
  setQ: () => { G.settings.qlen = G.settings.qlen >= 240 ? 120 : G.settings.qlen + 60; saveGame(); rr(); },
  setFF: () => { G.settings.ff = !G.settings.ff; saveGame(); rr(); },
  setNames: () => { G.settings.names = (G.settings.names + 1) % 3; saveGame(); rr(); },
  setSound: () => { G.settings.sound = !G.settings.sound; saveGame(); audioInit(); rr(); },
  quit: () => { saveGame(); G = null; go('title'); },
  renameOpen: () => { const p = byId(U.sel); if (!p) return; U.rn = p.name; U.modal = 'rename'; rr(); },
  renameSave: () => { if (renamePlayer(U.sel, U.rn)) { U.modal = ''; rr(); } else toast('Type a name using letters.'); },
  coachOpen: () => { U.cf = G.coach.first; U.cl = G.coach.last; U.modal = 'coach'; rr(); },
  coachSave: () => { if (renameCoach(U.cf, U.cl)) { U.modal = ''; rr(); } else toast('Type a first and last name using letters.'); },
  dunkCycle: () => { const p = byId(U.sel); if (p) { cycleDunk(p); sfx('good'); } rr(); },
  hofTab: k => { U.hofTab = k; rr(); },
  tradeFrom: id => { U.tab = 'trade'; U.tgive = [+id]; U.tget = []; U.tcred = 0; U.tview = 'browse'; NOTE = ''; go('office'); toast(`Offering ${byId(id).name}. Pick a player you want and tap ADD TO DEAL.`); },
  tTeam: d => { const L = tradeTeams(), i = L.indexOf(U.tt); U.tt = L[(i + +d + L.length) % L.length]; U.tget = []; U.tsel = null; U.tview = 'browse'; rr(); },
  tPick: () => { U.modal = 'tpick'; rr(); },
  tTeamSet: id => { if (+id === G.teamId) { toast('That is your own team.'); return; } U.tt = +id; U.tget = []; U.tsel = null; U.tview = 'browse'; U.modal = ''; rr(); },
  tSel: id => { U.tsel = +id; NOTE = ''; rr(); },
  tGet: id => { id = +id; NOTE = ''; U.tget = U.tget.includes(id) ? U.tget.filter(x => x !== id) : U.tget.concat(id); rr(); },
  tGive: id => { id = +id; U.tgive = U.tgive.includes(id) ? U.tgive.filter(x => x !== id) : U.tgive.concat(id); rr(); },
  tCred: d => { U.tcred = clamp((U.tcred || 0) + +d, 0, G.cc); rr(); },
  tDeal: () => { U.tview = 'deal'; NOTE = ''; rr(); },
  tBrowse: () => { U.tview = 'browse'; rr(); },
  tPropose: () => {
    const ev = evalTrade(U.tt, U.tget, U.tgive, U.tcred);
    if (!ev.ok) { NOTE = ''; sfx('opp'); toast(`${tFull(TEAMS[U.tt])} says no. ${ev.msg}`); return; }
    doTrade(U.tt, U.tget, U.tgive, U.tcred); sfx('swish');
    NOTE = '';
    U.tget = []; U.tgive = []; U.tcred = 0; U.tview = 'browse'; rr();
    toast(`Trade done! ${ev.get.map(p => p.name).join(', ')} ${ev.get.length > 1 ? 'join' : 'joins'} your team.`);
  },
  teamOpen: id => { const T = TEAMS[+id]; U.tid = +id; U.tc = T.city; U.tn = T.name; U.ta = T.abbr; U.modal = 'team'; rr(); },
  teamSave: () => { if (renameTeam(U.tid, U.tc, U.tn, U.ta)) { U.modal = ''; rr(); } else toast('A team needs a city and a 2 or 3 letter short name.'); },
  teamReset: () => { delete G.tnames[U.tid]; useLeague(G.league, G.tnames); saveGame(); U.modal = ''; rr(); }
});

/* ================= boot ================= */
window.addEventListener('keydown', keyDown);
window.addEventListener('keyup', keyUp);
window.addEventListener('resize', () => { layout(); });
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
window.addEventListener('blur', () => { if (M) { M.keys.clear(); if (M.joy === null) { M.in.x = 0; M.in.y = 0; } } });
document.addEventListener('visibilitychange', () => { if (document.hidden && M && !M.demo && !M.paused && M.phase !== 'final') pauseMatch(false); });
document.getElementById('rotGo').addEventListener('click', () => document.getElementById('rot').classList.remove('show'));
function boot(data) {
  buildIcons(); layout();
  const s = data && data.slot ? readSlot(data.slot) : null;
  if (s) { G = s; useLeague(G.league, G.tnames); ensureRosters(); go('hub'); } else go('title');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!M || M.demo) rr(); });
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (G ? { slot: G.slot } : {})); } catch (e) { /* not in the viewer */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
</html>
